name: Daily weather log

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-log
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch weather and update files
        run: python scripts/update.py

      - name: Commit and push
        run: |
          git config user.name "Erik"
          git config user.email "104572224+Erik-Sandqvist@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weather log: $(date -u +%F)"
          git push
